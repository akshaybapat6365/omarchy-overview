name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install git, Lua 5.5 & Node
        run: pacman -Syu --noconfirm git lua nodejs
      - uses: actions/checkout@v4
      - name: Shell & JS syntax checks
        run: |
          bash -n install.sh uninstall.sh PKGBUILD tests/lint.sh
          for f in *.js; do sed 's/^\.pragma .*//' "$f" | node --input-type=commonjs --check; done
      - name: Run Lua 5.5 unit test suite (144 tests)
        run: lua tests/lua/run.lua
      - name: Sandboxed install & uninstall test
        run: |
          TEST_HOME="$(mktemp -d)"
          HOME="$TEST_HOME" XDG_CONFIG_HOME="$TEST_HOME/.config" ./install.sh --wire-hypr --systemd --no-restart
          test -f "$TEST_HOME/.config/quickshell/overview/shell.qml"
          HOME="$TEST_HOME" XDG_CONFIG_HOME="$TEST_HOME/.config" ./uninstall.sh
